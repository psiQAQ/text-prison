StylesPath = styles
MinAlertLevel = suggestion
Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip
SkippedScopes = script, style, pre, figure, noscript, iframe, blockquote
IgnoredScopes = tt, code, kbd, samp, q

[*]
BasedOnStyles = NONE

[*.md]
BasedOnStyles = TextPrison
TextPrison.VagueLinkZh = NO
Microsoft.HeadingPunctuation = suggestion
Microsoft.Spacing = suggestion
Microsoft.UIVerbs = suggestion

[*.txt]
BasedOnStyles = NONE
Microsoft.Spacing = suggestion
Microsoft.UIVerbs = suggestion
