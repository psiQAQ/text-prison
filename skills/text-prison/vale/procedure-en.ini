StylesPath = styles
MinAlertLevel = suggestion
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip
SkippedScopes = script, style, pre, figure, noscript, iframe, blockquote
IgnoredScopes = tt, code, kbd, samp, q

[*]
BasedOnStyles = NONE

[*.md]
BasedOnStyles = TextPrison
TextPrison.VagueLinkZh = NO
Google.HeadingPunctuation = suggestion
Google.Spacing = suggestion
Google.Exclamation = suggestion

[*.txt]
BasedOnStyles = NONE
Google.Spacing = suggestion
Google.Exclamation = suggestion
